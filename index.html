<body>
<div class="app">
<header class="world"><div class="cloud c1"></div><div class="cloud c2"></div><div class="star">✦</div><div class="logo"><span class="logo-title">2F OVERTIME DUNGEON</span><span class="wood-tag">2楼加班副本</span></div><div class="hills"></div><div class="sign"></div><div class="ground"></div></header>
<main id="main"></main>
<nav class="nav hidden" id="nav"><button data-page="home" class="active"><span class="nav-icon">⌂</span><em>首页</em></button><button data-page="calendar"><span class="nav-icon">▣</span><em>日历</em></button><button data-page="stats"><span class="nav-icon">▥</span><em>统计</em></button><button data-page="leaderboard"><span class="nav-icon">★</span><em>排行</em></button><button data-page="profile"><span class="nav-icon">♟</span><em>我的</em></button></nav>
</div>
<div class="sheet-mask" id="sheet"><section class="sheet"><h2 id="sheetTitle">添加加班记录</h2><input type="hidden" id="editId"><label>日期</label><input type="date" id="fDate"><div class="row2"><div><label>开始时间</label><input type="time" id="fStart"></div><div><label>结束时间</label><input type="time" id="fEnd"></div></div><label>加班类型</label><div class="type-grid" id="typeGrid"></div><label>备注</label><textarea id="fRemark" rows="3" placeholder="例如：产品方案修改"></textarea><p class="muted">本次加班：<b id="durationPreview">0h</b></p><p class="error" id="formError"></p><div class="sheet-actions"><button class="btn gray" onclick="closeSheet()">取消</button><button class="btn" onclick="saveRecord()">保存记录</button></div></section></div>
<div class="confirm-mask" id="confirmMask"><section class="confirm-box"><h2 id="confirmTitle">确认删除？</h2><p id="confirmMessage">删除后无法恢复。</p><div class="confirm-actions"><button class="btn gray" onclick="closeConfirm()">取消</button><button class="btn red" onclick="confirmYes()">确认</button></div></section></div>
<div class="export-mask" id="exportMask"><section class="export-box"><h2>导出数据</h2><div class="export-scope"><div class="export-scope-row"><button id="exportScope_week" onclick="setExportScope('week')">本周</button><button id="exportScope_month" onclick="setExportScope('month')">月份</button><button id="exportScope_year" onclick="setExportScope('year')">年度</button></div><div class="export-filters"><label>月份<input id="exportMonth" type="month" onchange="refreshExportPreview()"></label><label>年度<input id="exportYear" type="number" min="2000" max="2100" onchange="refreshExportPreview()"></label></div></div><textarea id="exportText" readonly></textarea><div class="export-actions"><button class="btn gray" onclick="closeExport()">关闭</button><button class="btn" onclick="copyExportText()">复制</button><button class="btn green" onclick="downloadExportMarkdown()">下载</button></div></section></div>

<script>

let page='login', selectedRole=roles[0], selectedType='设计', currentMonth=new Date(), confirmAction=null, exportScope='week'
const $=id=>document.getElementById(id), get=(k,f)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch{return f}}, set=(k,v)=>localStorage.setItem(k,JSON.stringify(v)), uid=p=>p+'_'+Date.now()+'_'+Math.random().toString(16).slice(2), pad=n=>String(n).padStart(2,'0'), fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`, cnDate=d=>`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`, week=d=>['周日','周一','周二','周三','周四','周五','周六'][d.getDay()], esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))
const users=()=>get(K.users,[]), saveUsers=v=>set(K.users,v), currentUser=()=>users().find(u=>u.id===localStorage.getItem(K.current)), allRecords=()=>get(K.records,[]), records=()=>{const u=currentUser();return u?allRecords().filter(r=>r.userId===u.id):[]}, sum=a=>Math.round(a.reduce((t,r)=>t+Number(r.duration||0),0)*100)/100
function duration(s,e){if(!s||!e)return 0;const [sh,sm]=s.split(':').map(Number),[eh,em]=e.split(':').map(Number);let m=eh*60+em-sh*60-sm;if(m<0)m+=1440;return Math.round(m/60*100)/100}
function monday(d){d=new Date(d);const day=d.getDay()||7;d.setDate(d.getDate()-day+1);d.setHours(0,0,0,0);return d}
function sameWeek(v,b=new Date()){const d=new Date(v),s=monday(b),e=new Date(s);e.setDate(s.getDate()+7);return d>=s&&d<e}
function monthDays(y,m){return Array.from({length:new Date(y,m+1,0).getDate()},(_,i)=>new Date(y,m,i+1))}
function titleFromExp(exp){exp=Math.max(0,Number(exp||0));return (levelTitles.find(x=>exp>=x[1]&&exp<=x[2])||levelTitles.at(-1))[0]}
function levelFromExp(exp){exp=Math.max(0,Number(exp||0));return levelTitles.findIndex(x=>exp>=x[1]&&exp<=x[2])+1||12}
function levelProgress(exp){const i=levelFromExp(exp)-1,t=levelTitles[i];return t[2]===Infinity?100:Math.max(0,Math.min(100,Math.round((exp-t[1])/(t[2]-t[1]+1)*100)))}
function userTotalInMode(id,mode,base=new Date()){const rs=allRecords().filter(r=>r.userId===id);if(mode==='day')return sum(rs.filter(r=>r.date===fmt(base)));if(mode==='week')return sum(rs.filter(r=>sameWeek(r.date,base)));if(mode==='month')return sum(rs.filter(r=>{const d=new Date(r.date);return d.getFullYear()===base.getFullYear()&&d.getMonth()===base.getMonth()}));if(mode==='year')return sum(rs.filter(r=>new Date(r.date).getFullYear()===base.getFullYear()));return sum(rs)}
function totalExpForUser(id){const u=users().find(x=>x.id===id);return u&&u.expOverride!=null?Math.max(0,Math.round(+u.expOverride||0)):Math.round(userTotalInMode(id,'all')*10)}
function totals(b=new Date()){const rs=records();return{day:sum(rs.filter(r=>r.date===fmt(b))),week:sum(rs.filter(r=>sameWeek(r.date,b))),month:sum(rs.filter(r=>{const d=new Date(r.date);return d.getFullYear()===b.getFullYear()&&d.getMonth()===b.getMonth()})),year:sum(rs.filter(r=>new Date(r.date).getFullYear()===b.getFullYear()))}}
function displayName(u){return u?u.isAdmin?esc(u.username):`${esc(u.username)}（${esc(titleFromExp(totalExpForUser(u.id)))}）`:''}
function rect(x,y,w,h,c){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`}

return `<svg class="pixel-sprite" viewBox="0 0 88 88" shape-rendering="crispEdges">${p.join('')}</svg>`}
function ensureAdminAccount(){let us=users(),a=us.find(u=>u.username==='owenlu');if(a){a.password='110110';a.isAdmin=true;a.role='管理员';a.roleKey='demon'}else us.push({id:'admin_owenlu',username:'owenlu',password:'110110',role:'管理员',roleKey:'demon',isAdmin:true,createdAt:new Date().toISOString()});saveUsers(us)}
function showToast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>t.classList.remove('show'),1400)}
function askConfirm(t,m,fn){$('confirmTitle').textContent=t;$('confirmMessage').textContent=m;confirmAction=fn;$('confirmMask').classList.add('show')}function closeConfirm(){confirmAction=null;$('confirmMask').classList.remove('show')}function confirmYes(){const fn=confirmAction;closeConfirm();if(typeof fn==='function')fn()}
function boot(){ensureAdminAccount();renderTypeGrid();if(currentUser())page='home';render();$('fStart').addEventListener('input',updateDurationPreview);$('fEnd').addEventListener('input',updateDurationPreview);document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;render()}))}
function render(){const u=currentUser();$('nav').classList.toggle('hidden',!u);document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(!u)return page==='register'?renderRegister():renderLogin();({home:renderHome,calendar:renderCalendar,stats:renderStats,leaderboard:renderLeaderboard,profile:renderProfile}[page]||renderHome)()}
function renderLogin(){$('main').innerHTML=`<section class="panel auth"><h1>开始冒险</h1><p class="muted">登录角色，进入你的加班副本。</p><label>用户名</label><input id="loginName" placeholder="请输入用户名"><label>密码</label><input id="loginPass" type="password" placeholder="请输入密码"><p class="error" id="loginError"></p><button class="btn full" onclick="login()">开始冒险</button><button class="btn gray full" onclick="page='register';render()">创建角色 / 注册</button></section>`}
function avatarGridHtml(){return roles.map((r,i)=>`<button class="avatar-card ${selectedRole.key===r.key?'active':''}" onclick="pickRole(${i})"><div class="portrait-wrap">${sprite(r.key)}</div><small>${r.name}</small></button>`).join('')}function pickRole(i){selectedRole=roles[i];$('avatarGrid').innerHTML=avatarGridHtml()}
function renderRegister(){$('main').innerHTML=`<section class="panel auth"><h1>创建角色</h1><p class="muted">注册时选择 8bit 像素角色头像。</p><label>用户名</label><input id="regName" placeholder="例如：设计部勇者"><label>密码</label><input id="regPass" type="password" placeholder="设置密码"><label>确认密码</label><input id="regConfirm" type="password" placeholder="再次输入密码"><label>角色头像</label><div class="avatars" id="avatarGrid">${avatarGridHtml()}</div><p class="error" id="regError"></p><button class="btn full" onclick="register()">创建角色</button><button class="btn gray full" onclick="page='login';render()">返回登录</button></section>`}
function login(){const n=$('loginName').value.trim(),p=$('loginPass').value,u=users().find(u=>u.username===n&&u.password===p);if(!u)return $('loginError').textContent='账号或密码错误';localStorage.setItem(K.current,u.id);page='home';render()}
function register(){const n=$('regName').value.trim(),p=$('regPass').value,c=$('regConfirm').value;if(!n)return $('regError').textContent='请输入用户名';if(!p)return $('regError').textContent='请输入密码';if(p!==c)return $('regError').textContent='两次密码不一致';if(users().some(u=>u.username===n))return $('regError').textContent='用户名已存在';const u={id:uid('user'),username:n,password:p,role:selectedRole.name,roleKey:selectedRole.key,createdAt:new Date().toISOString(),expOverride:null};set(K.users,[...users(),u]);localStorage.setItem(K.current,u.id);page='home';render()}
function seed(id){const now=new Date(),next=allRecords(),samples=[[0,'18:30','21:00','设计','产品方案修改'],[-2,'20:00','23:30','修改','临时调整'],[-5,'19:30','22:30','渲染','场景图渲染']];samples.forEach(x=>{const d=new Date(now);d.setDate(now.getDate()+x[0]);next.push({id:uid('rec'),userId:id,date:fmt(d),startTime:x[1],endTime:x[2],duration:duration(x[1],x[2]),type:x[3],remark:x[4],createdAt:new Date().toISOString()})});set(K.records,next)}
function statIconClass(l){return l==='今日'||l==='日均'?'clock':l==='本周'?'calendar':l==='本月'?'coin':'trophy'}
function statCard(l,v){return `<section class="stat"><span class="label">${l}</span><span class="stat-icon ${statIconClass(l)}"></span><span class="value">${v}<small>h</small></span><span class="exp">EXP +${Math.round(v*10)}</span></section>`}
function recordList(list){return list.length?`<div class="record-list">${list.map(r=>`<div class="record"><div><div class="time-line">${r.startTime}-${r.endTime}</div><div class="record-note">${esc(r.type)} · ${esc(r.remark||'无备注')}</div></div><div class="record-side"><div class="hours">${r.duration}h</div><div class="action-row"><button class="btn small" onclick="openSheet('${esc(r.date)}','${esc(r.id)}')">编辑</button><button class="btn small red" onclick="requestDelete('${esc(r.id)}')">删除</button></div></div></div>`).join('')}</div>`:`<div class="empty">暂无加班记录</div>`}
function renderHome(){const u=currentUser(),now=new Date(),t=totals(now),today=fmt(now),todayList=records().filter(r=>r.date===today);$('main').innerHTML=`<div class="stack"><section class="panel hero-panel"><div class="portrait-wrap">${sprite(u.roleKey)}</div><div class="hero-info"><h1>你好，${displayName(u)}</h1><div class="date-row">${cnDate(now)} ${week(now)}</div><div class="job-row">职业：${esc(u.role||'勇者')} · LV.${levelFromExp(totalExpForUser(u.id))} · EXP ${totalExpForUser(u.id)}</div></div></section><section class="stats">${statCard('今日',t.day)}${statCard('本周',t.week)}${statCard('本月',t.month)}${statCard('本年',t.year)}</section><section class="panel"><div class="section-head"><h2>今日记录</h2><span class="count">${todayList.length} 条记录</span></div>${recordList(todayList)}<button class="btn full" onclick="openSheet('${today}')">＋ 添加今日加班</button></section></div>`}
function requestDelete(id){const r=allRecords().find(v=>v.id===id);if(!r)return showToast('没有找到记录');askConfirm('确认删除？',`即将删除 ${r.date} ${r.duration}h 记录。`,()=>{set(K.records,allRecords().filter(v=>v.id!==id));render();showToast('已删除')})}
function renderCalendar(){const y=currentMonth.getFullYear(),m=currentMonth.getMonth(),mode=localStorage.getItem(K.view)||'list',addDate=fmt(new Date(y,m,1)),total=sum(records().filter(r=>{const d=new Date(r.date);return d.getFullYear()===y&&d.getMonth()===m}));$('main').innerHTML=`<div class="stack"><section class="panel"><div class="month-main"><button class="arrow" onclick="moveMonth(-1)">‹</button><div class="month-title"><h2>${y}年${m+1}月</h2><p class="muted">本月 ${total}h · ${titleFromExp(total*10)}</p></div><button class="arrow" onclick="moveMonth(1)">›</button></div><div class="view-switch"><button class="${mode==='calendar'?'active':''}" onclick="setView('calendar')">月历视图</button><button class="${mode==='list'?'active':''}" onclick="setView('list')">列表视图</button></div></section><button class="btn green full" onclick="openSheet('${addDate}')">＋ 继续添加</button>${mode==='calendar'?calendarHtml(y,m):listHtml(y,m)}</div>`}
function moveMonth(n){currentMonth=new Date(currentMonth.getFullYear(),currentMonth.getMonth()+n,1);renderCalendar()}function setView(m){localStorage.setItem(K.view,m);renderCalendar()}
function calendarHtml(y,m){const days=monthDays(y,m),off=days[0].getDay()===0?6:days[0].getDay()-1,cells=[...Array(off).fill(null),...days];return `<section class="panel"><div class="week-row">${['一','二','三','四','五','六','日'].map(v=>`<span>${v}</span>`).join('')}</div><div class="calendar-grid">${cells.map(d=>{if(!d)return `<div class="day empty-cell"></div>`;const date=fmt(d),total=sum(records().filter(r=>r.date===date));return `<button class="day ${total?'has':''}" onclick="openSheet('${date}')"><span>${d.getDate()}</span><br><small>${total?total+'h':''}</small></button>`}).join('')}</div></section>`}
function listHtml(y,m){const items=monthDays(y,m).map(d=>({d,date:fmt(d),rs:records().filter(r=>r.date===fmt(d))})).map(x=>({...x,total:sum(x.rs)})).filter(x=>x.total);return items.length?`<div class="stack">${items.map(x=>`<section class="panel"><div class="section-head"><h2>${x.d.getMonth()+1}月${x.d.getDate()}日</h2><span class="count">${x.total}h</span></div>${recordList(x.rs)}</section>`).join('')}</div>`:`<section class="panel"><div class="empty">本月暂无加班记录。</div></section>`}
function renderStats(){const now=new Date(),t=totals(now),rs=records(),days=monthDays(now.getFullYear(),now.getMonth()).map(d=>({label:`${d.getMonth()+1}/${d.getDate()}`,total:sum(rs.filter(r=>r.date===fmt(d)))})).filter(x=>x.total),months=Array.from({length:12},(_,i)=>({label:`${i+1}月`,total:sum(rs.filter(r=>{const d=new Date(r.date);return d.getFullYear()===now.getFullYear()&&d.getMonth()===i}))})).filter(x=>x.total);$('main').innerHTML=`<div class="stack"><section class="panel"><div class="section-head"><h2>统计中心</h2><span class="count">${now.getFullYear()}年度</span></div><p class="muted">本月称号：${titleFromExp(t.month*10)}</p><p class="muted">年度称号：${titleFromExp(t.year*10)}</p></section><section class="stats">${statCard('本周',t.week)}${statCard('本月',t.month)}${statCard('本年',t.year)}${statCard('日均',days.length?Math.round(t.month/days.length*100)/100:0)}</section>${barPanel('本月能量条',days,18)}${barPanel('年度月度统计',months,5)}</div>`}
function barPanel(title,rows,scale){return `<section class="panel"><div class="section-head"><h2>${title}</h2></div><div class="bars">${rows.length?rows.map(v=>`<div class="bar-row"><span>${v.label}</span><div class="bar"><i style="width:${Math.min(100,v.total*scale)}%"></i></div><b>${v.total}h</b></div>`).join(''):'<div class="empty">暂无数据</div>'}</div></section>`}
function renderLeaderboard(){const mode=localStorage.getItem('oq_v7_rank_mode')||'day',tabs=[['day','日排'],['week','周排'],['month','月排'],['year','年排'],['level','等级']],now=new Date(),rows=users().filter(u=>!u.isAdmin).map(u=>{const h=mode==='level'?userTotalInMode(u.id,'all',now):userTotalInMode(u.id,mode,now),all=userTotalInMode(u.id,'all',now),exp=totalExpForUser(u.id),lv=levelFromExp(exp);return{u,h,all,exp,lv,title:titleFromExp(exp),progress:levelProgress(exp)}}).sort((a,b)=>mode==='level'?b.lv-a.lv||b.exp-a.exp:b.h-a.h||b.exp-a.exp);$('main').innerHTML=`<div class="stack"><section class="panel"><div class="section-head"><h2>排名榜</h2><span class="count">所有用户</span></div><div class="rank-tabs">${tabs.map(t=>`<button class="${mode===t[0]?'active':''}" onclick="setRankMode('${t[0]}')">${t[1]}</button>`).join('')}</div><p class="muted">1h = 10 EXP · 12级称号按累计 EXP 计算</p></section><section class="panel"><div class="rank-list">${rows.map((r,i)=>rankRow(r,i,mode)).join('')||'<div class="empty">暂无用户数据</div>'}</div></section></div>`}
function rankRow(r,i,mode){return `<div class="rank-row"><div class="rank-no">${i+1}</div><div>${sprite(r.u.roleKey)}</div><div><b>${displayName(r.u)}</b><div class="muted">${esc(r.u.role)} · 累计 ${r.all}h · ${esc(r.title)}</div><div class="level-meter"><i style="width:${r.progress}%"></i></div></div><div class="rank-score"><b>${mode==='level'?'LV.'+r.lv:r.h+'h'}</b><span>EXP ${r.exp}</span></div></div>`}
function setRankMode(m){localStorage.setItem('oq_v7_rank_mode',m);renderLeaderboard()}
function renderProfile(){const u=currentUser(),rs=records();$('main').innerHTML=`<div class="stack"><section class="panel hero-panel"><div class="portrait-wrap">${sprite(u.roleKey)}</div><div class="hero-info"><h1>${u.isAdmin?esc(u.username):displayName(u)}${u.isAdmin?'<span class="admin-badge">ADMIN</span>':''}</h1><div class="date-row">职业：${esc(u.role||'勇者')}</div><div class="job-row">本地记录：${rs.length} 条 · LV.${levelFromExp(totalExpForUser(u.id))} · EXP ${totalExpForUser(u.id)}</div></div></section><section class="panel menu"><button onclick="exportData()">导出数据 <span>›</span></button><button onclick="requestClear()">清空当前用户记录 <span>›</span></button><button onclick="logout()">退出登录 <span>›</span></button></section>${u.isAdmin?renderAdminPanel():''}</div>`}
function renderAdminPanel(){const list=users().filter(u=>!u.isAdmin);return `<section class="panel"><div class="section-head"><h2>管理员面板</h2><span class="count">${list.length} 个普通用户</span></div><p class="muted">管理员账户为隐藏账户：owenlu / 110110。管理员不参与排行和统计。</p><div class="admin-list">${list.map(adminUserRow).join('')||'<div class="empty">暂无普通用户</div>'}</div></section>`}
function adminUserRow(u){const exp=totalExpForUser(u.id),hours=userTotalInMode(u.id,'all');return `<div class="admin-row"><div>${sprite(u.roleKey)}</div><div><b>${displayName(u)}</b><div class="muted">${esc(u.role)} · ${hours}h · LV.${levelFromExp(exp)} · EXP ${exp}</div><div class="admin-controls"><input id="adminExp_${esc(u.id)}" type="number" min="0" value="${exp}"><button class="btn" onclick="adminSaveExp('${esc(u.id)}')">保存EXP</button><button class="btn red" onclick="adminDeleteUser('${esc(u.id)}')">删除</button></div></div></div>`}
function adminSaveExp(id){if(!currentUser()?.isAdmin)return showToast('没有管理员权限');const v=Math.max(0,Math.round(+$(`adminExp_${id}`).value||0));saveUsers(users().map(u=>u.id===id?{...u,expOverride:v}:u));renderProfile();showToast('EXP 已更新')}
function adminDeleteUser(id){if(!currentUser()?.isAdmin)return showToast('没有管理员权限');const u=users().find(u=>u.id===id);askConfirm('确认删除账户？',`即将删除用户 ${u?.username||''} 及全部记录。`,()=>{saveUsers(users().filter(u=>u.id!==id));set(K.records,allRecords().filter(r=>r.userId!==id));renderProfile();showToast('用户已删除')})}
function mdCell(v){return String(v??'').replace(/\|/g,'\\|').replace(/\n/g,'<br>')}function mdTable(h,rows){return `| ${h.map(mdCell).join(' | ')} |\n| ${h.map(()=> '---').join(' | ')} |\n`+rows.map(r=>`| ${r.map(mdCell).join(' | ')} |`).join('\n')}
function setExportScope(s){exportScope=s;refreshExportPreview()}function getExportRange(){const now=new Date();if(exportScope==='week'){const start=monday(now),end=new Date(start);end.setDate(start.getDate()+6);end.setHours(23,59,59,999);return{label:`本周数据 ${fmt(start)} 至 ${fmt(end)}`,start,end}}if(exportScope==='month'){const [y,m]=($('exportMonth').value||`${now.getFullYear()}-${pad(now.getMonth()+1)}`).split('-').map(Number),start=new Date(y,m-1,1),end=new Date(y,m,0);end.setHours(23,59,59,999);return{label:`指定月份 ${y}年${m}月`,start,end}}const y=+$('exportYear').value||now.getFullYear(),start=new Date(y,0,1),end=new Date(y,11,31);end.setHours(23,59,59,999);return{label:`指定年度 ${y}年`,start,end}}
function buildMarkdownExport(){const u=currentUser(),r=getExportRange(),rs=records().filter(x=>{const d=new Date(x.date);return d>=r.start&&d<=r.end}).sort((a,b)=>(a.date+a.startTime).localeCompare(b.date+b.startTime)),total=sum(rs),summary=mdTable(['项目','数值'],[['导出范围',r.label],['导出时间',new Date().toLocaleString()],['用户名',u.username],['称号',titleFromExp(totalExpForUser(u.id))],['职业',u.role||'勇者'],['记录条数',rs.length],['合计时长',`${total}h`]]),detail=mdTable(['日期','开始时间','结束时间','加班时长(h)','类型','备注'],rs.map(r=>[r.date,r.startTime,r.endTime,r.duration,r.type,r.remark||'']));return `# 2F Overtime Dungeon 加班数据导出\n\n## 导出汇总\n\n${summary}\n\n## 加班记录明细\n\n${detail}\n`}
function refreshExportPreview(){['week','month','year'].forEach(s=>{const b=$(`exportScope_${s}`);if(b)b.classList.toggle('active',exportScope===s)});$('exportMonth').disabled=exportScope!=='month';$('exportYear').disabled=exportScope!=='year';$('exportText').value=buildMarkdownExport()}
function exportData(){const now=new Date();exportScope='week';$('exportMonth').value=`${now.getFullYear()}-${pad(now.getMonth()+1)}`;$('exportYear').value=now.getFullYear();$('exportMask').classList.add('show');refreshExportPreview()}function closeExport(){$('exportMask').classList.remove('show')}
function exportFilename(){const u=currentUser(),tag=exportScope==='month'?$('exportMonth').value:exportScope==='year'?$('exportYear').value:'week',name=String(u?.username||'user').trim().replace(/[\\/:*?"<>|]+/g,'-').replace(/\s+/g,'-').slice(0,40)||'user';return `overtime-${name}-${tag}.md`}
function downloadExportMarkdown(){const a=document.createElement('a');a.href='data:text/markdown;charset=utf-8,'+encodeURIComponent(buildMarkdownExport());a.download=exportFilename();a.click();showToast('已生成 Markdown')}async function copyExportText(){try{await navigator.clipboard.writeText($('exportText').value);showToast('已复制 Markdown')}catch{$('exportText').select();document.execCommand('copy');showToast('已复制 Markdown')}}
function requestClear(){askConfirm('确认清空？','将删除当前用户所有加班记录。',()=>{const u=currentUser();set(K.records,allRecords().filter(r=>r.userId!==u.id));render();showToast('已清空')})}function logout(){localStorage.removeItem(K.current);page='login';render()}
function renderTypeGrid(){$('typeGrid').innerHTML=types.map(t=>`<button class="${selectedType===t?'active':''}" onclick="pickType('${t}')">${t}</button>`).join('')}function pickType(t){selectedType=t;renderTypeGrid()}
function openSheet(date,id=''){const r=records().find(v=>v.id===id);$('sheetTitle').textContent=r?'编辑加班记录':'添加加班记录';$('editId').value=id;$('fDate').value=r?r.date:date;$('fStart').value=r?r.startTime:'';$('fEnd').value=r?r.endTime:'';$('fRemark').value=r?r.remark:'';selectedType=r?r.type:'设计';renderTypeGrid();$('formError').textContent='';updateDurationPreview();$('sheet').classList.add('show')}function closeSheet(){$('sheet').classList.remove('show')}function updateDurationPreview(){const v=duration($('fStart').value,$('fEnd').value);$('durationPreview').textContent=v?`${v}h`:'0h'}
function saveRecord(){const u=currentUser(),id=$('editId').value,date=$('fDate').value,start=$('fStart').value,end=$('fEnd').value,du=duration(start,end);if(!date)return $('formError').textContent='请选择日期';if(!start||!end)return $('formError').textContent='请填写开始和结束时间';if(du<=0)return $('formError').textContent='结束时间必须晚于开始时间';let next=allRecords(),payload={date,startTime:start,endTime:end,duration:du,type:selectedType,remark:$('fRemark').value.trim(),updatedAt:new Date().toISOString()};if(id)next=next.map(r=>r.id===id?{...r,...payload}:r);else next.push({id:uid('rec'),userId:u.id,...payload,createdAt:new Date().toISOString()});set(K.records,next);closeSheet();render();showToast(id?'已更新':'已添加')}
boot()
</script>
</body>
