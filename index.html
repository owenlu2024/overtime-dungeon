<body>
<div class="app">
<header class="world"><div class="cloud c1"></div><div class="cloud c2"></div><div class="star">✦</div><div class="logo"><span class="logo-title">2F OVERTIME DUNGEON</span><span class="wood-tag">2楼加班副本</span></div><div class="hills"></div><div class="sign"></div><div class="ground"></div></header>
<main id="main"></main>
<nav class="nav hidden" id="nav"><button data-page="home" class="active"><span class="nav-icon nav-home"></span><em>首页</em></button><button data-page="calendar"><span class="nav-icon nav-calendar"></span><em>日历</em></button><button data-page="stats"><span class="nav-icon nav-stats"></span><em>统计</em></button><button data-page="leaderboard"><span class="nav-icon nav-rank"></span><em>排行</em></button><button data-page="profile"><span class="nav-icon nav-user"></span><em>我的</em></button></nav>
</div>
<div class="sheet-mask" id="sheet"><section class="sheet"><h2 id="sheetTitle">添加加班记录</h2><input type="hidden" id="editId"><label>日期</label><input type="date" id="fDate"><div class="row2"><div><label>开始时间</label><input type="time" id="fStart"></div><div><label>结束时间</label><input type="time" id="fEnd"></div></div><label>加班类型</label><div class="type-grid" id="typeGrid"></div><label>备注</label><textarea id="fRemark" rows="3" placeholder="例如：产品方案修改"></textarea><p class="muted">本次加班：<b id="durationPreview">0h</b></p><p class="error" id="formError"></p><div class="sheet-actions"><button class="btn gray" onclick="closeSheet()">取消</button><button class="btn" id="saveRecordBtn" onclick="saveRecord(this)">保存记录</button></div></section></div>
<div class="confirm-mask" id="confirmMask"><section class="confirm-box"><h2 id="confirmTitle">确认删除？</h2><p id="confirmMessage">删除后无法恢复。</p><div class="confirm-actions"><button class="btn gray" onclick="closeConfirm()">取消</button><button class="btn red" id="confirmYesBtn" onclick="confirmYes(this)">确认</button></div></section></div>
<div class="export-mask" id="exportMask"><section class="export-box"><button class="pixel-close" onclick="closeExport()" aria-label="关闭导出">×</button><h2>导出数据</h2><div class="export-scope"><div class="export-scope-row"><button id="exportScope_week" onclick="setExportScope('week')">本周</button><button id="exportScope_month" onclick="setExportScope('month')">月份</button></div><div class="export-filters"><label>月份<input id="exportMonth" type="month" onchange="refreshExportPreview()"></label></div></div><textarea id="exportText" readonly></textarea><div class="export-actions"><button class="btn" onclick="copyExportText()">复制</button><button class="btn green" onclick="downloadExportMarkdown()">下载</button></div></section></div>
<div class="toast" id="toast"></div>
<script src="app-config.js"></script>
<script src="app-data.js"></script>
<script src="app.js"></script>
</body>
